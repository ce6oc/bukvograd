<!doctype html>
<!--
  Буквоград — PWA для изучения русского алфавита.
  Запуск: положите index.html, manifest.webmanifest, sw.js, icon.svg в одну папку
  и откройте через любой статический сервер (например: npx serve . или GitHub Pages).
  Для установки на планшет нужен HTTPS (или localhost). Всё работает офлайн после первого открытия.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Буквоград — учим буквы</title>
<meta name="description" content="Игровое путешествие по русскому алфавиту: слушаем, пишем, играем. Для планшетов, работает офлайн.">
<meta name="theme-color" content="#FBF3E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Буквоград">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF3E6; --surface:#FFFFFF; --ink:#473F5E; --ink2:#8B83A5; --line:#EBDFCC;
  --coral:#EE8A7C; --coral-d:#C25B4E; --coral-s:#FBE4E0;
  --apricot:#F0B269; --apricot-d:#C07E2E; --apricot-s:#FBEEDC;
  --butter:#E5C568; --butter-d:#A98A2F; --butter-s:#F9F0D8;
  --sage:#96C27B; --sage-d:#5F8F4A; --sage-s:#E7F2DE;
  --teal:#72C0B4; --teal-d:#3E8B80; --teal-s:#DFF2EF;
  --sky:#7FA9DD; --sky-d:#4A74B0; --sky-s:#E2ECF9;
  --peri:#8F98DA; --peri-d:#5A63B2; --peri-s:#E6E8F8;
  --lav:#AC90D8; --lav-d:#7A57AD; --lav-s:#EFE7F8;
  --rose:#DB8FB9; --rose-d:#AF5586; --rose-s:#F8E5F0;
  --ok:#5F8F4A; --ok-s:#E7F2DE; --warn:#C07E2E; --warn-s:#FBEEDC;
  --bad:#C25B4E; --bad-s:#FBE4E0; --info:#4A74B0; --info-s:#E2ECF9;
  --tbh:64px; --rlg:26px; --rmd:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none; scrollbar-width:thin; scrollbar-color:var(--lav) #F3EAD9}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#F3EAD9;border-radius:10px}
::-webkit-scrollbar-thumb{background:var(--lav);border-radius:10px;border:3px solid #F3EAD9}
::-webkit-scrollbar-thumb:hover{background:var(--lav-d)}
body{
  margin:0; font-family:'Nunito','Segoe UI',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(160deg,#FDF6E9 0%,#F4EDFA 48%,#EAF4EF 100%) fixed;
  font-size:17px; line-height:1.45; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; min-height:100dvh;
}
input,textarea{user-select:text;-webkit-user-select:text}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}

/* ---------- фон ---------- */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.cloud{position:absolute;background:rgba(255,255,255,.75);border-radius:999px;filter:blur(1px);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{width:150px;height:44px;top:9%;animation-duration:95s}
.c1::before{width:60px;height:60px;left:24px;top:-26px}.c1::after{width:44px;height:44px;left:76px;top:-18px}
.c2{width:110px;height:34px;top:32%;animation-duration:130s;animation-delay:-40s;opacity:.6}
.c2::before{width:44px;height:44px;left:18px;top:-20px}.c2::after{width:34px;height:34px;left:56px;top:-13px}
.c3{width:180px;height:50px;top:64%;animation-duration:160s;animation-delay:-90s;opacity:.5}
.c3::before{width:70px;height:70px;left:30px;top:-30px}.c3::after{width:52px;height:52px;left:96px;top:-22px}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(calc(100vw + 240px))}}
#sun{position:absolute;top:76px;right:4%;width:92px;height:92px;opacity:.9;animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{position:absolute;font-size:18px;opacity:.35;animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(8deg)}}

/* ---------- верхняя панель ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--tbh);z-index:50;
  background:rgba(253,246,233,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:3px solid var(--line)}
.tb-in{max-width:1080px;margin:0 auto;height:100%;display:flex;align-items:center;gap:10px;padding:0 16px}
#logo{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:14px}
#logo:active{transform:scale(.95)}
#logo .wordmark{font-weight:900;font-size:21px;letter-spacing:.4px}
#logo .wordmark b{color:var(--lav-d)}
.tb-sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:7px;border:3px solid var(--line);background:var(--surface);
  border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.tb-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.tb-btn .ic{font-size:19px;line-height:1}
#btnSound[aria-pressed="false"]{background:#F1ECF7;color:var(--ink2)}

/* ---------- каркас экранов ---------- */
main{max-width:1080px;margin:0 auto;padding:calc(var(--tbh) + 14px) 16px 48px}
.screen{display:none}
.screen.active{display:block;animation:fadeSlide .38s cubic-bezier(.2,.9,.3,1.1)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:3px solid var(--line);border-radius:var(--rlg);box-shadow:0 6px 0 rgba(120,100,150,.10)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;
  padding:14px 24px;border-radius:999px;font-weight:900;font-size:18px;color:#fff;
  background:var(--c,var(--lav-d));box-shadow:0 5px 0 var(--cd,#5E4188);transition:transform .12s, box-shadow .12s;min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd,#5E4188)}
.btn.ghost{background:var(--surface);color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.small{padding:10px 18px;font-size:16px;min-height:46px}
.btn[disabled]{opacity:.55;pointer-events:none}
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.crumb h2{margin:0;font-size:26px;font-weight:900;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:3px solid var(--line);
  border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18)}}

/* ---------- персонажи ---------- */
.char{display:block}
.char .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 108px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.char .eyes{animation:blink 4.6s infinite;transform-origin:60px 56px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.08)}}
.char .arm-wave{transform-origin:96px 70px}
.char.waving .arm-wave{animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
.char .mouth-open{opacity:0}
.char.talking .mouth-open{opacity:1;animation:talk .26s ease-in-out infinite alternate;transform-origin:60px 66px}
.char.talking .mouth-smile{opacity:0}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.char.dancing .bob{animation:dance .7s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
.char.nomming .mouth-open{opacity:1}
.char.nomming .mouth-smile{opacity:0}

/* ---------- пузырь речи ---------- */
.bubble{position:relative;background:var(--surface);border:3px solid var(--lav);border-radius:20px;
  padding:14px 18px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--lav-s);animation:bubbleIn .35s cubic-bezier(.2,.9,.3,1.3)}
.bubble::before{content:"";position:absolute;left:-13px;top:15px;width:20px;height:20px;background:var(--surface);
  border-left:3px solid var(--lav);border-bottom:3px solid var(--lav);transform:rotate(45deg);border-radius:0 0 0 6px}
.bubble.down::before{left:34px;top:auto;bottom:-13px;transform:rotate(-45deg)}
@keyframes bubbleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* ---------- главная ---------- */
.hero{display:flex;align-items:flex-end;gap:16px;margin:6px 0 18px}
.hero .mascot{flex:0 0 auto;width:128px;cursor:pointer;transition:transform .15s}
.hero .mascot:active{transform:scale(.93)}
.hero .bubble{flex:1;margin-bottom:16px;cursor:pointer}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:26px}
.mode-card{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;cursor:pointer;
  background:var(--surface);border:3px solid var(--mc,var(--line));border-radius:var(--rlg);
  box-shadow:0 6px 0 var(--mcs,var(--line));transition:transform .13s}
.mode-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mcs,var(--line))}
.mode-card .mi{font-size:38px;line-height:1;flex:0 0 auto;width:60px;height:60px;display:grid;place-items:center;
  background:var(--mcs,#F4EFE7);border-radius:18px}
.mode-card h3{margin:0 0 2px;font-size:19px;font-weight:900}
.mode-card p{margin:0;font-size:14px;font-weight:700;color:var(--ink2)}
.mode-card.locked{opacity:.65}
.map-head{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
.map-head h2{margin:0;font-size:24px;font-weight:900}
.map-head span{color:var(--ink2);font-weight:700;font-size:14px}
#map{position:relative;width:100%}
#map svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--cd);
  background:var(--cs);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0;box-shadow:0 5px 0 rgba(120,100,150,.16);transition:transform .13s;animation:popIn .45s backwards cubic-bezier(.2,.9,.3,1.4)}
.node:active{transform:translate(-50%,-50%) scale(.9)}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.node .nl{font-weight:900;color:var(--cd);line-height:1}
.node .ns{font-size:11px;letter-spacing:1px;color:var(--butter-d);line-height:1.2}
.node.done{background:var(--c);border-color:var(--cd)}
.node.done .nl{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.14)}
.node.done .ns{color:#FFF6DC}
.node.locked{background:#F2EDF6;border-color:#D9D2E6;box-shadow:none}
.node.locked .nl{color:#B7AECB}
.node .lock{position:absolute;right:-4px;bottom:-4px;font-size:14px;background:var(--surface);border-radius:50%;
  width:24px;height:24px;display:grid;place-items:center;border:2px solid #D9D2E6}
.node.current{border-color:var(--cd)}
.node.current::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--c);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.82);opacity:.9}to{transform:scale(1.18);opacity:0}}
.node.current::before{content:"👋";position:absolute;top:-26px;right:-12px;font-size:22px;animation:floaty 2.2s ease-in-out infinite}
.node.party{border-radius:26px}
.node.party .np{font-size:30px;line-height:1}
.node.wob{animation:wobble .5s}
@keyframes wobble{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-50%,-50%) rotate(-8deg)}60%{transform:translate(-50%,-50%) rotate(7deg)}}
.dist-label{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:900;color:var(--ink2);
  background:rgba(255,255,255,.8);padding:2px 9px;border-radius:999px;border:2px solid var(--line);pointer-events:none;white-space:nowrap}
.map-legend{margin-top:14px;color:var(--ink2);font-weight:700;font-size:14px;text-align:center}
.home-foot{margin-top:26px;text-align:center;color:var(--ink2);font-weight:800}

/* ---------- урок ---------- */
.lesson-stars{font-size:22px;color:var(--butter-d);letter-spacing:2px}
.station-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.station{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;cursor:pointer;text-align:left;
  background:var(--surface);border:3px solid var(--sc,var(--line));border-radius:var(--rlg);
  box-shadow:0 6px 0 var(--scs,var(--line));transition:transform .13s;position:relative}
.station:active{transform:translateY(4px);box-shadow:0 1px 0 var(--scs,var(--line))}
.station .si{font-size:40px;line-height:1;width:72px;height:72px;display:grid;place-items:center;background:var(--scs,#F4EFE7);border-radius:22px}
.station h3{margin:2px 0 0;font-size:21px;font-weight:900}
.station p{margin:0;color:var(--ink2);font-weight:700;font-size:14px}
.station .badge{position:absolute;top:14px;right:14px;font-weight:900;font-size:14px;padding:4px 12px;border-radius:999px}
.station .badge.ok{background:var(--ok-s);color:var(--ok)}
.station .badge.go{background:var(--scs);color:var(--scd)}
.lesson-note{margin-top:18px;text-align:center;font-weight:800;color:var(--ink2)}
.lesson-hero{display:flex;gap:14px;align-items:flex-end}
.lesson-hero .charbox{width:104px;flex:0 0 auto}
.lesson-hero .bubble{flex:1;margin-bottom:12px}

/* знакомство */
.meet-grid{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:18px;margin-top:16px;align-items:start}
.letter-card{display:flex;align-items:baseline;justify-content:center;gap:16px;padding:26px 10px;cursor:pointer;
  background:var(--cs);border:4px solid var(--c);border-radius:var(--rlg);box-shadow:0 7px 0 var(--c)}
.letter-card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.letter-card .big{font-size:118px;font-weight:900;color:var(--cd);line-height:1}
.letter-card .small{font-size:64px;font-weight:900;color:var(--cd);opacity:.75;line-height:1}
.letter-card.squish{animation:squish .4s}
@keyframes squish{30%{transform:scale(.94,.9)}60%{transform:scale(1.04,1.06)}}
.sound-chips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.word-card{display:flex;align-items:center;gap:16px;padding:16px 20px;cursor:pointer;background:var(--surface);
  border:3px solid var(--line);border-radius:var(--rlg);box-shadow:0 5px 0 var(--line)}
.word-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.word-card .we{font-size:58px;line-height:1}
.word-card .ww{font-size:28px;font-weight:900}
.word-card .ww b{color:var(--cd)}
.word-card .hint{font-size:13px;color:var(--ink2);font-weight:700}

/* письмо */
.write-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.case-toggle{display:inline-flex;background:#F1ECF7;border-radius:999px;padding:4px;border:3px solid var(--line)}
.case-toggle button{border:0;background:none;border-radius:999px;padding:8px 20px;font-weight:900;font-size:19px;cursor:pointer;color:var(--ink2)}
.case-toggle button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.write-wrap{position:relative;width:min(400px,86vw);margin:6px auto;background:var(--surface);border:3px solid var(--line);
  border-radius:var(--rlg);box-shadow:0 6px 0 rgba(120,100,150,.1);overflow:hidden}
.write-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
#inkCanvas{touch-action:none;cursor:crosshair}
.write-status{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0;font-weight:800}
.sdot{width:16px;height:16px;border-radius:50%;background:#E4DEF0;display:inline-grid;place-items:center;font-size:10px;color:#fff}
.sdot.done{background:var(--ok)}
.sdot.act{background:var(--c);animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{transform:scale(1.3)}}

/* игры */
.game-head{display:flex;gap:12px;align-items:flex-end;margin:12px 0}
.game-head .charbox{width:78px;flex:0 0 auto}
.game-head .bubble{flex:1;margin-bottom:8px;font-size:17px;padding:11px 15px}
.game-head .bubble.down::before{left:26px}
.repeat-btn{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:3px solid var(--sky);background:var(--sky-s);
  font-size:22px;cursor:pointer;box-shadow:0 4px 0 var(--sky);margin-bottom:8px}
.repeat-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky)}
.dots{display:flex;gap:7px;justify-content:center;margin:6px 0 14px}
.rdot{width:13px;height:13px;border-radius:50%;background:#E4DEF0}
.rdot.done{background:var(--ok)}
.rdot.act{background:var(--c,var(--lav));animation:pulse2 1.4s infinite}
.arena{min-height:300px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{border:4px solid var(--line);background:var(--surface);border-radius:22px;padding:18px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 var(--line);transition:transform .12s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tile .tl{font-size:56px;font-weight:900;line-height:1.1}
.tile .ts{font-size:24px;font-weight:800;color:var(--ink2)}
.tile.good{border-color:var(--ok);background:var(--ok-s);box-shadow:0 6px 0 var(--ok);animation:popGood .5s}
.tile.good .tl{color:var(--ok)}
@keyframes popGood{35%{transform:scale(1.1)}}
.tile.bad{animation:wobble2 .45s;opacity:.55}
@keyframes wobble2{25%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}}
.word-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.wtile{border:4px solid var(--line);background:var(--surface);border-radius:22px;padding:18px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 var(--line)}
.wtile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.wtile .we{font-size:54px;line-height:1}
.wtile .ww{font-size:20px;font-weight:900}
.wtile .ww b{color:var(--ok)}
.wtile.good{border-color:var(--ok);background:var(--ok-s);box-shadow:0 6px 0 var(--ok);animation:popGood .5s}
.wtile.bad{animation:wobble2 .45s;opacity:.55}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto}
.pcol{display:flex;flex-direction:column;gap:12px}
.pbtn{border:4px solid var(--line);background:var(--surface);border-radius:20px;font-size:44px;font-weight:900;
  padding:12px;cursor:pointer;box-shadow:0 5px 0 var(--line);min-height:82px}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pbtn.sel{border-color:var(--sky);background:var(--sky-s);box-shadow:0 5px 0 var(--sky)}
.pbtn.lock{border-color:var(--ok);background:var(--ok-s);color:var(--ok);box-shadow:0 5px 0 var(--ok);pointer-events:none;animation:popGood .5s}
.pbtn.bad{animation:wobble2 .45s}
.catch-arena{position:relative;height:clamp(300px,46vh,400px);background:linear-gradient(180deg,#F3EFFA,#EAF4EF);
  border:3px solid var(--line);border-radius:var(--rlg);overflow:hidden}
.catch-count{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:var(--surface);
  border:3px solid var(--butter);border-radius:999px;padding:5px 16px;font-weight:900;font-size:17px}
.catch-char{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:100px;z-index:2;pointer-events:none}
.bubble-letter{position:absolute;left:0;top:0;border-radius:50%;border:4px solid var(--cd);background:var(--cs);
  font-weight:900;color:var(--cd);display:grid;place-items:center;cursor:pointer;will-change:transform;
  box-shadow:0 4px 0 rgba(120,100,150,.15);padding:0}
.game-end{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 16px;text-align:center}
.big-stars{display:flex;gap:10px;font-size:56px;line-height:1;justify-content: center;padding: 10px 0;}
.big-stars span{color:#E4DEF0;animation:starPop .55s backwards cubic-bezier(.2,.9,.3,1.5)}
.big-stars span.on{color:var(--butter);text-shadow:0 3px 0 var(--butter-d)}
.big-stars span:nth-child(2){animation-delay:.25s}.big-stars span:nth-child(3){animation-delay:.5s}
@keyframes starPop{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:scale(1) rotate(0)}}

/* ---------- оверлей ---------- */
#overlay{position:fixed;inset:0;z-index:100;background:rgba(71,63,94,.38);display:grid;place-items:center;padding:20px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.ov-card{background:var(--surface);border:4px solid var(--line);border-radius:30px;max-width:460px;width:100%;
  padding:28px 24px;text-align:center;box-shadow:0 10px 0 rgba(60,45,90,.2);animation:bubbleIn .4s cubic-bezier(.2,.9,.3,1.3);max-height:88dvh;overflow-y:auto}
.ov-card h2{margin:8px 0 4px;font-size:27px;font-weight:900}
.ov-card .sub{color:var(--ink2);font-weight:800;margin:0 0 14px}
.ov-card .charbox{width:130px;margin:0 auto}
.ov-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ov-sticker{font-size:84px;line-height:1;animation:starPop .7s .2s backwards cubic-bezier(.2,.9,.3,1.4)}
.ov-extra{margin-top:12px;background:var(--butter-s);border:3px solid var(--butter);border-radius:18px;padding:10px 14px;font-weight:900}

/* ---------- альбом ---------- */
.album-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:16px}
.sticker-card{padding:20px 12px;text-align:center;border-radius:var(--rlg);border:3px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--line);cursor:pointer}
.sticker-card .se{font-size:60px;line-height:1.2;display:block}
.sticker-card h3{margin:8px 0 2px;font-size:18px;font-weight:900}
.sticker-card p{margin:0;font-size:12.5px;color:var(--ink2);font-weight:700}
.sticker-card.locked{border-style:dashed;background:#FAF7F1;cursor:default}
.sticker-card.locked .se{filter:grayscale(1);opacity:.35}
.sticker-card.wig{animation:wobble2 .5s}

/* ---------- родители ---------- */
.gate{max-width:420px;margin:30px auto;padding:28px;text-align:center}
.gate h2{margin:0 0 6px;font-size:24px;font-weight:900}
.gate p{color:var(--ink2);font-weight:700;margin:0 0 16px}
.gate .q{font-size:34px;font-weight:900;margin-bottom:14px}
.gate input{width:150px;font-size:26px;font-weight:900;text-align:center;padding:10px;border:3px solid var(--line);border-radius:16px;font-family:inherit;color:var(--ink)}
.gate.shake{animation:wobble2 .45s}
.par-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.par-card{padding:20px}
.par-card h3{margin:0 0 12px;font-size:19px;font-weight:900}
.par-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:2px dashed var(--line);font-weight:700}
.par-row:last-child{border-bottom:0}
.switch{position:relative;width:58px;height:32px;flex:0 0 auto}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch .tr{position:absolute;inset:0;background:#DDD5EA;border-radius:999px;transition:background .2s}
.switch .tr::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.switch input:checked + .tr{background:var(--ok)}
.switch input:checked + .tr::after{transform:translateX(26px)}
.lchips{display:flex;flex-wrap:wrap;gap:7px}
.lchip{width:52px;padding:5px 0;text-align:center;border-radius:13px;border:2px solid var(--line);background:#FAF7F1;font-weight:900}
.lchip small{display:block;font-size:9px;color:var(--butter-d);letter-spacing:.5px;line-height:1}
.lchip.done{background:var(--ok-s);border-color:var(--ok)}
.par-note{font-size:13.5px;color:var(--ink2);font-weight:700;margin-top:10px}
.par-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.danger{--c:var(--bad);--cd:#9E453B}

/* ---------- служебное ---------- */
#fx{position:fixed;inset:0;z-index:200;pointer-events:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);z-index:300;background:var(--ink);
  color:#FFF8EC;font-weight:800;padding:12px 22px;border-radius:999px;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:88vw;text-align:center;box-shadow:0 6px 18px rgba(60,45,90,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:700px){
  .meet-grid{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .hero .mascot{width:96px}
  .tb-btn .lbl{display:none}
  .crumb h2{font-size:22px}
  #sun{width:64px;height:64px;top:72px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function audio(){if(!st.settings.sound)return null;
  try{if(!AC){const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;AC=new Ctx();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type='sine',vol=.3,delay=0,slide){
  const ac=audio();if(!ac)return;const t0=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);
}

const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let ruVoice=null,talkingEl=null,talkTimer=null;
function pickVoice(){if(!synth)return null;const vs=synth.getVoices().filter(v=>/^ru/i.test(v.lang));
  ruVoice=vs.find(v=>/Milena|Google|Yuri|Alena/i.test(v.name))||vs[0]||null;return ruVoice}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function stopTalk(){if(talkingEl){talkingEl.classList.remove('talking');talkingEl=null}if(talkTimer){clearTimeout(talkTimer);talkTimer=null}if(synth)try{synth.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}}
/* Встроенный голос: клипы audio/<fnv1a16>.m4a, сгенерированные tools/gen_audio.py (голос Ирина).
   Хэш считается от текста фразы, поэтому манифест не нужен. Последовательность строк = очередь клипов. */
let curAudio=null;
function hash36(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return (h>>>0).toString(16)}
function synthSpeak(text,onEnd){
  if(!synth){if(onEnd)onEnd();return}
  try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.85;u.pitch=1.12;u.volume=1;
  const v=pickVoice();if(v)u.voice=v;let done=false;const fin=()=>{if(done)return;done=true;if(onEnd)onEnd()};
  u.onend=fin;u.onerror=fin;synth.speak(u);setTimeout(fin,text.length*110+2200)}catch(e){if(onEnd)onEnd()}
}
function speak(items,onEnd){
  if(!st.settings.sound){if(onEnd)onEnd();return}
  if(typeof items==='string')items=[items];
  const joined=items.join(' ');let i=0,done=false;
  const fin=()=>{if(done)return;done=true;if(onEnd)onEnd()};
  if(synth)try{synth.cancel()}catch(e){}
  const next=()=>{
    if(i>=items.length)return fin();
    try{if(curAudio){try{curAudio.pause()}catch(e){}}
      const a=new Audio('audio/'+hash36(items[i])+'.m4a');curAudio=a;
      a.onended=()=>{i++;next()};
      a.onerror=()=>{console.warn('[speak] нет клипа, резервный синтез:',items[i]);synthSpeak(joined,fin)};
      a.play().catch(fin);
    }catch(e){synthSpeak(joined,fin)}
  };
  next();
}
function talk(charEl,bubbleEl,text,speakText){
  if(bubbleEl){bubbleEl.textContent=text;bubbleEl.style.animation='none';void bubbleEl.offsetWidth;bubbleEl.style.animation=''}
  if(talkingEl)talkingEl.classList.remove('talking');
  talkingEl=charEl||null;if(charEl)charEl.classList.add('talking');
  speak(speakText||text,()=>{if(charEl)charEl.classList.remove('talking');if(talkingEl===charEl)talkingEl=null});
}

const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRaf=null,fxLast=0;
function fxSize(){const d=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
fxSize();addEventListener('resize',fxSize);
function burst(x,y,n=26,power=1){
  if(reduced)n=Math.min(n,6);
  for(let k=0;k<n;k++){const a=rnd(0,Math.PI*2),sp=rnd(120,420)*power;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-160*power,rot:rnd(0,6.3),vr:rnd(-7,7),w:rnd(6,11),c:pick(PAL).m,life:rnd(.9,1.6),t:0,shape:Math.random()<.35?'c':'r'})}
  if(parts.length>320)parts.splice(0,parts.length-320);
  if(!fxRaf){fxLast=performance.now();fxRaf=requestAnimationFrame(fxLoop)}
}
function rain(){if(reduced){burst(innerWidth/2,innerHeight/3,10);return}
  for(let k=0;k<50;k++)parts.push({x:rnd(0,innerWidth),y:rnd(-60,-10),vx:rnd(-40,40),vy:rnd(40,140),rot:rnd(0,6.3),vr:rnd(-6,6),w:rnd(7,12),c:pick(PAL).m,life:rnd(1.6,2.6),t:0,shape:Math.random()<.4?'c':'r'});
  if(!fxRaf){fxLast=performance.now();fxRaf=requestAnimationFrame(fxLoop)}}
function fxLoop(now){
  const dt=Math.min(.04,(now-fxLast)/1000);fxLast=now;
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>{p.t+=dt;if(p.t>p.life)return false;
    p.vy+=760*dt;p.vx*=.995;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const a=1-p.t/p.life;fctx.save();fctx.globalAlpha=a;fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillStyle=p.c;
    if(p.shape==='c'){fctx.beginPath();fctx.arc(0,0,p.w/2,0,6.3);fctx.fill()}else fctx.fillRect(-p.w/2,-p.w/3,p.w,p.w*.66);
    fctx.restore();return p.y<innerHeight+40});
  if(parts.length)fxRaf=requestAnimationFrame(fxLoop);else{fxRaf=null;fctx.clearRect(0,0,innerWidth,innerHeight)}
}
function burstAt(el,n=24){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n)}

  const box=$('#map');if(!box)return;const W=box.clientWidth;if(!W)return;
  const per=W>860?6:W>600?5:4;
  const size=clamp((W-40)/per*.58,58,92);
  const mx=size*.75+12,usable=W-2*mx,rowH=size*2.05,amp=size*.22,top=size*.95;
  const pts=STOPS.map((s,k)=>{const row=Math.floor(k/per);let col=k%per;if(row%2)col=per-1-col;
    const t=per>1?col/(per-1):.5;return {x:mx+usable*t,y:top+row*rowH+Math.sin(t*Math.PI)*amp*(row%2?-1:1),s,k}});
  const rows=Math.ceil(STOPS.length/per),H=top+(rows-1)*rowH+size*1.15;
  box.style.height=H+'px';
  let segs='',full='';
  for(let k=0;k<pts.length-1;k++){
    const p0=pts[k-1]||pts[k],p1=pts[k],p2=pts[k+1],p3=pts[k+2]||pts[k+1];
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    const d=`M${p1.x},${p1.y} C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y}`;full+=d+' ';
    const s=p1.s,gi=s.kind==='letter'?GROUPS.findIndex(g=>g.includes(s.i)):s.g;
    const col=PAL[GROUP_PAL[gi]].m;
    const faded=stopState(p1.s)==='locked'&&stopState(p2.s)==='locked';
    segs+=`<path d="${d}" stroke="${col}" stroke-width="16" fill="none" stroke-linecap="round" opacity="${faded?.22:.5}"/>`;
  }
  let nodes='';
  pts.forEach(({x,y,s,k})=>{
    const state=stopState(s);const delay=animate?Math.min(k*22,650):0;
    if(s.kind==='letter'){
      const p=pal(s.i),bs=bestStars(s.i);

        :`<span class="nl" style="font-size:${size*.44}px">${DATA[s.i].ch}</span>${state==='locked'?'<span class="lock">🔒</span>':''}`;
      nodes+=`<button class="node ${state}" data-k="${k}" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;--c:${p.m};--cd:${p.d};--cs:${p.s};animation-delay:${delay}ms" aria-label="Буква ${DATA[s.i].ch}${state==='done'?`, выучена, звёзд: ${bs}`:state==='locked'?', закрыта':''}">${inner}</button>`;
    }else{
      const gp=PAL[GROUP_PAL[s.g]],stk=STICKERS[s.g];
      nodes+=`<button class="node party ${state}" data-k="${k}" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;--c:${gp.m};--cd:${gp.d};--cs:${gp.s};animation-delay:${delay}ms" aria-label="Праздник улицы ${GROUP_NAMES[s.g]}${state==='locked'?', закрыт':''}"><span class="np">${state==='done'?stk.emo:'🎁'}</span>${state==='locked'?'<span class="lock">🔒</span>':''}</button>`;
    }
  });
  let labels='';
  GROUPS.forEach((g,gi)=>{const first=pts.find(p=>p.s.kind==='letter'&&p.s.i===g[0]);
    labels+=`<span class="dist-label" style="left:${first.x}px;top:${first.y-size*.62}px">улица ${GROUP_NAMES[gi]}</span>`});
  box.innerHTML=`<svg class="road" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${segs}<path d="${full}" stroke="rgba(255,255,255,.85)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="10 14"/></svg>${labels}${nodes}`;
  box.querySelectorAll('.node').forEach(nd=>nd.addEventListener('click',()=>{
    const s=STOPS[+nd.dataset.k],state=stopState(s);
    if(state==='locked'){sfx.no();nd.classList.remove('wob');void nd.offsetWidth;nd.classList.add('wob');
      toast(s.kind==='letter'?`Сначала выучи букву ${DATA[s.i-1].ch} 🙂`:`Выучи все буквы улицы ${GROUP_NAMES[s.g]} — будет праздник! 🎁`);return}
    sfx.tap();

  }));
}

const sampler=(()=>{const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('width','0');svg.setAttribute('height','0');
  svg.style.position='absolute';const path=document.createElementNS(ns,'path');svg.appendChild(path);document.body.appendChild(svg);
  return d=>{path.setAttribute('d',d);const len=path.getTotalLength();const n=Math.max(2,Math.ceil(len/3));const pts=[];
    for(let k=0;k<=n;k++){const pt=path.getPointAtLength(len*k/n);pts.push({x:pt.x,y:pt.y,hit:false})}
    return {pts,len,start:pts[0]}};
})();
function mountWrite(body,idx){

   </div>

     <canvas id="guideCanvas"></canvas><canvas id="inkCanvas"></canvas>
   </div>

   <p class="lesson-note">Веди пальчиком по дорожке — от цифры к цифре, по стрелочке ➜</p>`;
  const wrap=body.querySelector('#writeWrap'),gc=body.querySelector('#guideCanvas'),ic=body.querySelector('#inkCanvas');
  const g=gc.getContext('2d'),ink=ic.getContext('2d'),status=body.querySelector('#writeStatus');
  const makeCase=key=>({strokes:L[key].map(d=>({d,p2d:new Path2D(d),...sampler(d)})),done:L[key].map(()=>false),ink:[],complete:false});
  const cases={U:makeCase('U'),L:makeCase('L')};
  let ck='U',scale=4,dashOff=0,demo=null,raf=null,last=0,drawing=null,finished=false;
  const C=()=>cases[ck];

  function size(){

    const d=Math.min(2,devicePixelRatio||1);scale=w/100;
    [gc,ic].forEach(c=>{c.width=w*d;c.height=h*d;c.getContext('2d').setTransform(d*scale,0,0,d*scale,0,0)});

  function drawGuide(){

      if(c.done[k]){g.strokeStyle=p.m;g.lineWidth=14;g.stroke(s.p2d)}

        g.fillStyle=p.d;g.beginPath();g.moveTo(4,0);g.lineTo(-3,-3.4);g.lineTo(-3,3.4);g.closePath();g.fill();g.restore();
      }
    });
  }
  function drawInk(){

    ink.globalAlpha=1;

  function pos(e){const r=ic.getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}

  body.querySelector('#eraseBtn').addEventListener('click',()=>{

  function loop(now){

        const s=c.strokes[demo.si];demo.t+=dt*115;
        const upto=Math.min(demo.t,s.len);
        demo.trail=s.pts.filter((q,k)=>k/(s.pts.length-1)*s.len<=upto).map(q=>({x:q.x,y:q.y}));
        if(demo.t>=s.len){demo.si++;demo.t=0;demo.pause=.28;demo.trail=[]}
        drawInk();
      }else{demo=null;drawInk()}
    }
    drawGuide();
    raf=requestAnimationFrame(loop);
  }
  const onResize=()=>size();addEventListener('resize',onResize);
  onCleanup(()=>{cancelAnimationFrame(raf);removeEventListener('resize',onResize)});
  size();statusUp();last=performance.now();raf=requestAnimationFrame(loop);
}

/* ---- игровые раунды (общие для урока и повторения) ---- */
function gameHead(host,idx,text){
  const head=h(`<div class="game-head"><div class="charbox">${charSVG(idx,{size:78})}</div><div class="bubble down"></div><button class="repeat-btn" aria-label="Повтори вопрос">🔊</button></div>`);
  host.appendChild(head);
  const ch=head.querySelector('.char'),bub=head.querySelector('.bubble');let question=text;
  head.querySelector('.repeat-btn').addEventListener('click',()=>{sfx.tap();talk(ch,bub,bub.textContent,question)});
  return {ch,bub,ask(t,sp){question=sp||t;talk(ch,bub,t,sp)},say(t,sp){talk(ch,bub,t,sp)}};
}
function confusers(idx,exclude=[]){
  const set=new Set((CONF[DATA[idx].ch]||'').split('').map(c=>DATA.findIndex(d=>d.ch===c)).filter(i=>i>=0));
  [idx-1,idx+1,idx-2,idx+2].forEach(i=>{if(i>=0&&i<33)set.add(i)});
  exclude.forEach(i=>set.delete(i));set.delete(idx);
  return shuffle([...set]);
}
function roundFind(host,idx,hooks){
  const head=gameHead(host,idx,`Где буква ${DATA[idx].ch}?`);
  const opts=shuffle([idx,...confusers(idx).slice(0,3)]);
  const arena=h(`<div class="arena"><div class="tiles">${opts.map(i=>{const p=pal(i);
    return `<button class="tile" data-i="${i}" style="--c:${p.m}"><span class="tl" style="color:${p.d}">${DATA[i].ch}</span><span class="ts">${DATA[i].ch.toLowerCase()}</span></button>`}).join('')}</div></div>`);
  host.appendChild(arena);
  schedule(()=>head.ask(`Где буква ${DATA[idx].ch}?`,`Найди букву ${DATA[idx].name}`),350);
  let busy=false;
  arena.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{
    if(busy||t.classList.contains('bad'))return;const i=+t.dataset.i;
    if(i===idx){busy=true;t.classList.add('good');sfx.ok();burstAt(t,20);
      head.say(pick(PRAISE)+' Это '+DATA[idx].ch+'!',pick(PRAISE));
      schedule(()=>hooks.done(),950);
    }else{t.classList.add('bad');sfx.no();hooks.miss();
      head.say(`Это буква ${DATA[i].ch}. Ищем ${DATA[idx].ch}!`,['Это '+DATA[i].name+'.','Ищем '+DATA[idx].name])}
  }));
}
function roundWord(host,idx,hooks){
  const low=DATA[idx].ch.toLowerCase();

  const others=shuffle(DATA.map((_,i)=>i).filter(i=>i!==idx&&!DATA[i].word.includes(low))).slice(0,2);
  const opts=shuffle([idx,...others]);

  host.appendChild(arena);

  let busy=false;
  arena.querySelectorAll('.wtile').forEach(t=>t.addEventListener('click',()=>{

      head.say(`${DATA[i].word}! Здесь живёт ${DATA[idx].ch}!`,`${DATA[i].word}! Здесь живёт буква ${DATA[idx].name}`);

function roundPairs(host,letters,hooks){
  const three=shuffle(letters).slice(0,3);
  const head=gameHead(host,three[0],'Соедини большие и маленькие буквы!');
  const left=shuffle(three),right=shuffle(three);
  const arena=h(`<div class="arena"><div class="pairs">
    <div class="pcol">${left.map(i=>`<button class="pbtn" data-i="${i}" data-s="u">${DATA[i].ch}</button>`).join('')}</div>
    <div class="pcol">${right.map(i=>`<button class="pbtn" data-i="${i}" data-s="l">${DATA[i].ch.toLowerCase()}</button>`).join('')}</div>
  </div></div>`);
  host.appendChild(arena);
  schedule(()=>head.ask('Соедини большие и маленькие буквы!','Найди пару: соедини большую и маленькую букву'),350);
  let sel=null,locked=0,busy=false;
  arena.querySelectorAll('.pbtn').forEach(b=>b.addEventListener('click',()=>{
    if(busy||b.classList.contains('lock'))return;
    if(!sel){sel=b;b.classList.add('sel');sfx.tap();speak(DATA[+b.dataset.i].name);return}
    if(sel===b){b.classList.remove('sel');sel=null;return}
    if(sel.dataset.s===b.dataset.s){sel.classList.remove('sel');sel=b;b.classList.add('sel');sfx.tap();speak(DATA[+b.dataset.i].name);return}
    const a=sel;sel=null;
    if(a.dataset.i===b.dataset.i){
      a.classList.remove('sel');a.classList.add('lock');b.classList.add('lock');sfx.ok();burstAt(b,14);locked++;
      if(locked===3){busy=true;head.say('Все пары нашлись! 🎉','Все пары нашлись!');schedule(()=>hooks.done(),900)}
      else head.say(`Да! ${DATA[+b.dataset.i].ch} и ${DATA[+b.dataset.i].ch.toLowerCase()} — пара!`,`Да! ${DATA[+b.dataset.i].name}`);
    }else{a.classList.remove('sel');a.classList.add('bad');b.classList.add('bad');sfx.no();hooks.miss();
      schedule(()=>{a.classList.remove('bad');b.classList.remove('bad')},480);
      head.say('Не пара 🙂 Попробуй ещё!','Не пара. Попробуй ещё!')}
  }));
}
function roundCatch(host,idx,hooks){
  const NEED=5;
  const head=gameHead(host,idx,`Лови буквы ${DATA[idx].ch}! Нужно ${NEED} штук.`);
  const arena=h(`<div class="arena"><div class="catch-arena">
    <span class="catch-count">Поймано: 0 / ${NEED}</span>
    <div class="catch-char">${charSVG(idx,{size:100})}</div>
  </div></div>`);
  host.appendChild(arena);
  const field=arena.querySelector('.catch-arena'),cnt=arena.querySelector('.catch-count'),chEl=arena.querySelector('.char');
  const pool=[idx,...confusers(idx).slice(0,5)];
  let bubbles=[],caught=0,raf=null,last=performance.now(),stopped=false;
  function letterFor(){const targets=bubbles.filter(b=>b.i===idx).length;return targets<2?idx:pick(pool)}
  function spawn(forceTarget){
    const i=forceTarget?idx:letterFor();const p=pal(i);const sz=rnd(58,78);
    const el=h(`<button class="bubble-letter" style="width:${sz}px;height:${sz}px;font-size:${sz*.46}px;--cd:${p.d};--cs:${p.s}" aria-label="Буква ${DATA[i].ch}">${DATA[i].ch}</button>`);
    const W=field.clientWidth,H=field.clientHeight;
    const b={i,el,sz,x:rnd(8,Math.max(9,W-sz-8)),y:rnd(8,Math.max(9,H-130-sz)),vx:rnd(-1,1)<0?-rnd(26,52):rnd(26,52),vy:rnd(-1,1)<0?-rnd(20,42):rnd(20,42)};
    el.style.transform=`translate(${b.x}px,${b.y}px)`;
    el.addEventListener('click',()=>tapB(b));
    field.appendChild(el);bubbles.push(b);
  }
  function remove(b){bubbles=bubbles.filter(x=>x!==b);b.el.remove()}
  function tapB(b){
    if(stopped)return;
    if(b.i===idx){
      caught++;sfx.nom();sfx.pop();burstAt(b.el,14);
      chEl.classList.add('nomming');schedule(()=>chEl.classList.remove('nomming'),320);
      cnt.textContent=`Поймано: ${caught} / ${NEED}`;
      b.el.animate([{transform:b.el.style.transform+' scale(1)',opacity:1},{transform:b.el.style.transform+' scale(1.6)',opacity:0}],{duration:260});
      remove(b);
      if(caught>=NEED){stopped=true;cancelAnimationFrame(raf);head.say('Все поймал! Ням! 😋','Все поймал! Ням!');schedule(()=>hooks.done(),900)}
      else spawn(Math.random()<.45);
    }else{sfx.no();hooks.miss();b.vx*=-1.8;b.vy*=-1.8;
      b.el.animate([{rotate:'0deg'},{rotate:'-14deg'},{rotate:'12deg'},{rotate:'0deg'}],{duration:380});
      head.say(`Это ${DATA[b.i].ch}. Лови только ${DATA[idx].ch}!`,['Это '+DATA[b.i].name+'.','Лови только '+DATA[idx].name])}
  }
  for(let k=0;k<7;k++)spawn(k<2);
  function loop(now){
    if(stopped)return;
    const dt=Math.min(.04,(now-last)/1000);last=now;
    const W=field.clientWidth,H=field.clientHeight;
    bubbles.forEach(b=>{
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.vx=clamp(b.vx,-60,60);b.vy=clamp(b.vy,-50,50);
      if(b.x<4){b.x=4;b.vx=Math.abs(b.vx)}if(b.x>W-b.sz-4){b.x=W-b.sz-4;b.vx=-Math.abs(b.vx)}
      if(b.y<4){b.y=4;b.vy=Math.abs(b.vy)}if(b.y>H-124-b.sz){b.y=H-124-b.sz;b.vy=-Math.abs(b.vy)}
      b.el.style.transform=`translate(${b.x}px,${b.y}px)`;
    });
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  onCleanup(()=>{stopped=true;cancelAnimationFrame(raf)});
  schedule(()=>head.ask(`Лови буквы ${DATA[idx].ch}! Нужно ${NEED} штук.`,`Лови букву ${DATA[idx].name}! Нужно ${NEED} штук`),350);
}
function dotsHTML(total,cur){return `<div class="dots">${Array.from({length:total},(_,k)=>`<span class="rdot ${k<cur?'done':k===cur?'act':''}"></span>`).join('')}</div>`}

/* ---- игра буквы ---- */
function mountPlay(body,idx){
  const type=idx%4,total=type===1?4:type===2?2:type===3?1:4;
  let r=0,mistakes=0;
  const wrap=h(`<div></div>`);body.appendChild(wrap);
  function runRound(){
    wrap.innerHTML=dotsHTML(total,r)+`<div class="roundHost"></div>`;
    const host=wrap.querySelector('.roundHost');
    const hooks={done(){r++;schedule(runRoundOrEnd,150)},miss(){mistakes++}};
    if(type===0)roundFind(host,idx,hooks);
    else if(type===1)roundWord(host,idx,hooks);
    else if(type===2){const others=shuffle(DATA.map((_,i)=>i).filter(i=>i!==idx)).slice(0,2);roundPairs(host,[idx,...others],hooks)}
    else roundCatch(host,idx,hooks);
  }
  function runRoundOrEnd(){
    if(r<total)return runRound();
    const stars=calcStars(mistakes);
    const newly=afterStation(idx,'game',stars);
    if(newly)return;
    sfx.win();
    wrap.innerHTML=`<div class="game-end card">${bigStars(stars)}
      <h2 style="margin:0;font-weight:900">${stars===3?'Блестяще!':stars===2?'Здорово!':'Получилось!'}</h2>
      <p style="margin:0;color:var(--ink2);font-weight:800">${mistakes===0?'Ни одной ошибки!':`Ошибок: ${mistakes} — это не страшно 🙂`}</p>
      <div class="ov-btns"><button class="btn ghost" id="againBtn">Ещё раз 🔄</button><button class="btn" id="menuBtn" style="--c:var(--teal-d);--cd:#2E6B62">К уроку ✓</button></div></div>`;
    burstAt(wrap,26);
    schedule(()=>speak(pick(PRAISE)),250);
    wrap.querySelector('#againBtn').addEventListener('click',()=>{sfx.tap();go('lesson',{idx,view:'play'})});
    wrap.querySelector('#menuBtn').addEventListener('click',()=>{sfx.tap();go('lesson',{idx,view:'menu'})});
  }
  runRound();
}

function renderSession(sec,cfg){
  const letters=cfg.kind==='party'?GROUPS[cfg.kind==='party'?cfg.g:0]:learned();
  const title=cfg.kind==='party'?`Праздник улицы ${GROUP_NAMES[cfg.g]}`:cfg.kind==='review'?'Повторение':'Микс-игра';
  const ROUNDS=8;
  let plan=[];
  {
    const order=cfg.kind==='mix'?null:shuffle(letters);
    let types=['find','word','find','pairs','word','find','word','find'];
    if(cfg.kind==='mix')types=shuffle(types);
    for(let k=0;k<ROUNDS;k++){
      let type=types[k%types.length];
      if(type==='pairs'&&letters.length<3)type='find';
      const target=cfg.kind==='mix'?pick(letters):order[k%order.length];
      plan.push({type,target});

    const hooks={done(){if(!roundMiss)perfect++;r++;schedule(()=>r<ROUNDS?runRound():finish(),150)},miss(){mistakes++;roundMiss=true}};
    if(type==='find')roundFind(host,target,hooks);

    const al=overlay.querySelector('#ovAlbum');if(al)al.addEventListener('click',()=>{sfx.tap();go('album')});
    schedule(()=>speak(sticker?`Ура! Новая наклейка: ${sticker.name}!`:'Молодец! Ты вспомнил буквы!'),350);

      <div class="par-btns">
        <button class="btn small ghost" id="expBtn">⬇️ Сохранить в файл</button>
        <button class="btn small ghost" id="impBtn">⬆️ Загрузить из файла</button>
        <input type="file" id="impFile" accept="application/json,.json" hidden>
      </div>
      <div class="par-btns" style="margin-top:14px">
        <button class="btn small danger" id="resetBtn">🗑 Сбросить прогресс</button>
      </div>
      <p class="par-note">Экспорт помогает перенести прогресс на другой планшет или сделать резервную копию.</p>
    </div>
  </div>`;
  sec.querySelector('#backBtn').addEventListener('click',()=>{sfx.tap();go('home')});
  sec.querySelector('#swSound').addEventListener('change',e=>{st.settings.sound=e.target.checked;save();syncSound();if(st.settings.sound)sfx.ok()});
  sec.querySelector('#swFree').addEventListener('change',e=>{st.settings.free=e.target.checked;save();sfx.tap();toast(st.settings.free?'Все буквы открыты 🔓':'Буквы снова открываются по порядку')});
  sec.querySelector('#voiceTest').addEventListener('click',()=>{speak('Привет! Я Буквик. Давай учить буквы вместе!')});
  const ib=sec.querySelector('#installBtn');
  if(ib)ib.addEventListener('click',async()=>{try{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.remove()}catch(e){}});
  sec.querySelector('#expBtn').addEventListener('click',()=>{
    sfx.tap();const blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`bukvograd-${dayKey()}.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Прогресс сохранён в файл 💾');
  });
  const impF=sec.querySelector('#impFile');
  sec.querySelector('#impBtn').addEventListener('click',()=>{sfx.tap();impF.click()});
  impF.addEventListener('change',()=>{
    const f=impF.files[0];impF.value='';if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const p=JSON.parse(r.result);
      if(!p||p.v!==1||typeof p.letters!=='object')throw 0;
      showOverlay(`<h2>Загрузить прогресс?</h2><p class="sub">Текущий прогресс на этом устройстве будет заменён.</p>
        <div class="ov-btns"><button class="btn ghost" id="ovNo">Отмена</button><button class="btn" id="ovYes" style="--c:var(--teal-d);--cd:#2E6B62">Загрузить</button></div>`,hideOverlay);
      overlay.querySelector('#ovNo').addEventListener('click',hideOverlay);
      overlay.querySelector('#ovYes').addEventListener('click',()=>{st=Object.assign(fresh(),p,{settings:Object.assign({sound:true,free:false},p.settings)});save();syncSound();hideOverlay();sfx.ok();toast('Прогресс загружен ✅');go('home')});
    }catch(e){toast('Не получилось прочитать файл 😔')}};
    r.readAsText(f);
  });
  let armed=false,armT=null;
  const rb=sec.querySelector('#resetBtn');
  rb.addEventListener('click',()=>{
    if(!armed){armed=true;rb.textContent='⚠️ Точно сбросить всё?';sfx.no();armT=setTimeout(()=>{armed=false;rb.textContent='🗑 Сбросить прогресс'},3500);return}
    clearTimeout(armT);st=fresh();save();syncSound();sfx.tap();toast('Прогресс сброшен. Начинаем заново 🌱');go('home');
  });
}

/* ================= PWA / ИНИЦИАЛИЗАЦИЯ ================= */
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  if(currentScreen==='home'){const c=$('#installChip');if(c){c.hidden=false;c.addEventListener('click',async()=>{try{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;c.hidden=true}catch(err){}},{once:true})}}});
addEventListener('appinstalled',()=>{deferredPrompt=null;toast('Буквоград установлен! Ищи его на домашнем экране 📲')});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
/* иконка для iOS — рисуем на canvas */
(function(){try{
  const make=()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    const gr=x.createLinearGradient(0,0,180,180);gr.addColorStop(0,'#FDF6E9');gr.addColorStop(1,'#EFE7F8');
    x.fillStyle=gr;x.beginPath();x.roundRect?x.roundRect(0,0,180,180,40):x.rect(0,0,180,180);x.fill();
    x.strokeStyle='#7A57AD';x.lineWidth=17;x.lineCap='round';x.lineJoin='round';
    x.beginPath();x.moveTo(48,140);x.lineTo(90,38);x.lineTo(132,140);x.stroke();
    x.beginPath();x.moveTo(63,108);x.lineTo(117,108);x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(78,84,9,0,6.3);x.arc(102,84,9,0,6.3);x.fill();
    x.fillStyle='#473F5E';x.beginPath();x.arc(80,86,4,0,6.3);x.arc(104,86,4,0,6.3);x.fill();
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(make).catch(make);else make();
}catch(e){}})();

function syncSound(){
  const b=$('#btnSound');b.setAttribute('aria-pressed',String(st.settings.sound));
  b.querySelector('.ic').textContent=st.settings.sound?'🔊':'🔇';
  b.setAttribute('aria-label',st.settings.sound?'Выключить звук':'Включить звук');
  if(!st.settings.sound)stopTalk();
}
$('#btnSound').addEventListener('click',()=>{st.settings.sound=!st.settings.sound;save();syncSound();if(st.settings.sound)sfx.ok();toast(st.settings.sound?'Звук включён 🔊':'Тишина… 🔇')});
$('#btnParents').addEventListener('click',()=>{sfx.tap();go('parents')});
$('#logo').addEventListener('click',()=>{sfx.tap();go('home')});
$('#logoChar').innerHTML=charSVG(-1,{size:34,letter:'Б',variant:0});
document.addEventListener('pointerdown',function init(){removeEventListener('pointerdown',init);
  if(st.settings.sound){audio();
    try{const u=new Audio('data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQIAAAAAAA==');u.volume=0;const p=u.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}
    if(synth){try{const u=new SpeechSynthesisUtterance('а');u.volume=0;u.lang='ru-RU';synth.speak(u)}catch(e){}}}
},{once:true});
document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
syncSound();
if(!storageOK)toast('Приватный режим? Прогресс может не сохраниться 😔');
go('home');
</script>
</body>
</html>
